<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="protectivebeta.css">
</head>
<body>

    <div class="container">
        <div class="block left">
            <h2>Great White Shark</h2>
            <img src="whiteshark.jpg" alt="Great White Shark" class="big-image">
            <p id="left-paragraph-1"></p>
            <p id="left-paragraph-2"></p>
        </div>
        
        <div class="block middle">
            <h2>Hammerhead Shark</h2>
            <img src="hammerheadshark.jpg" alt="Hammerhead Shark" class="big-image">
            <p id="middle-paragraph-1"></p>
            <p id="middle-paragraph-2"></p>
        </div>
        
        <div class="block right">
            <h2>Whale Shark</h2>
            <img src="whaleshark.jpg" alt="Whale Shark" class="small-image">
            <p id="right-paragraph-1"></p>
            <p id="right-paragraph-2"></p>
        </div>

        <div class="block blacktip">
            <h2>Blacktip Reef Shark</h2>
            <img src="reefshark.jpg" alt="Blacktip Reef Shark" class="small-image">
            <p id="blacktip-paragraph-1"></p>
